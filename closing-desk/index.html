<title>Hub Closing Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Arimo:wght@400;700&display=swap">
<style>
/* Layout: sticky file bar, left module rail, working pane. Data entered once, every module reads the same order record. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e9edf2; --line:#d3d9e1; --fg:#16202c; --muted:#5a6676;
  --accent:#1c4d8c; --accent-soft:#e3ecf8; --accent-fg:#ffffff;
  --ok:#17734a; --ok-bg:#e3f3ea; --warn:#8f5d00; --warn-bg:#fbf0d6; --bad:#b3261e; --bad-bg:#fce8e6;
  --paper:#ffffff; --ink:#111111; --rule:#333333; --paper-soft:#f3f3f3;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --form:'Arimo',Arial,Helvetica,sans-serif;
  --side-bg:#1e3352; --side-band:#152740; --side-fg:#e3eaf4; --side-muted:#a6b6cc; --side-hi:#3a7bd5; --side-line:rgba(255,255,255,.09); --side-input:#162943;
  --band-bg:#e6f0fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --surface-2:#1c2531; --line:#2b3645; --fg:#e3e8ef; --muted:#97a3b4;
  --accent:#86b4ff; --accent-soft:#1b2a42; --accent-fg:#0b1322;
  --ok:#5fd19a; --ok-bg:#11301f; --warn:#f0b85a; --warn-bg:#33270f; --bad:#ff8a7e; --bad-bg:#3a1714;
  --side-bg:#0f1a2b; --side-band:#0a1320; --side-hi:#2f63ad; --side-input:#0b1525; --band-bg:#13233a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --surface-2:#1c2531; --line:#2b3645; --fg:#e3e8ef; --muted:#97a3b4;
  --accent:#86b4ff; --accent-soft:#1b2a42; --accent-fg:#0b1322;
  --ok:#5fd19a; --ok-bg:#11301f; --warn:#f0b85a; --warn-bg:#33270f; --bad:#ff8a7e; --bad-bg:#3a1714;
  --side-bg:#0f1a2b; --side-band:#0a1320; --side-hi:#2f63ad; --side-input:#0b1525; --band-bg:#13233a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;min-width:0}
.filebar select{max-width:280px}
.statusbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:0;min-height:calc(100% - 60px)}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;min-width:0}
.side-sec{padding:14px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--side-line)}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);font-weight:600;display:flex;justify-content:space-between}
.side input[type=search]{background:var(--side-input);border-color:var(--side-line);color:var(--side-fg)}
.side input[type=search]::placeholder{color:var(--side-muted)}
.side-list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto}
.fi{all:unset;cursor:pointer;display:grid;gap:1px;padding:7px 10px;border-radius:6px}
.fi:hover{background:var(--side-line)} .fi:focus-visible{outline:2px solid var(--side-hi)}
.fi[aria-current="true"]{background:var(--side-hi)}
.fi b{font:600 13px var(--mono);color:#fff;display:flex;justify-content:space-between;gap:6px}
.fi small{color:var(--side-muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi[aria-current="true"] small{color:#e8f0ff}
.fi .dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted);align-self:center}
.fi .dot.closed{background:#5fd19a}
.side .empty{color:var(--side-muted)}
nav.rail{padding:6px 0 14px;display:flex;flex-direction:column;gap:0}
nav.rail button{all:unset;cursor:pointer;padding:8px 14px 8px 22px;color:var(--side-fg);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px}
nav.rail button:hover{background:var(--side-line)}
nav.rail button[aria-current="true"]{background:var(--side-hi);color:#fff;font-weight:600}
nav.rail button:focus-visible{outline:2px solid var(--side-hi);outline-offset:-2px}
nav.rail button.home{padding-left:14px;font-weight:600}
nav.rail .flow{font-size:13px;font-weight:700;color:#fff;background:var(--side-band);padding:8px 14px;margin-top:6px;font-family:var(--mono)}
nav.rail .subflow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:8px 14px 2px}
.side-foot{margin-top:auto;padding:12px 14px;font-size:12px;color:var(--side-muted);border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:4px}
.side-foot .row{display:flex;justify-content:space-between;gap:8px}
.side-foot i{font-style:normal;color:var(--side-fg)}
.band{border:1px solid var(--line);border-radius:8px;background:var(--band-bg);margin-bottom:18px;overflow:hidden}
.band-tab{display:inline-block;background:var(--accent);color:var(--accent-fg);font:600 14px var(--mono);padding:6px 20px;border-bottom-right-radius:8px}
.band-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 20px;padding:10px 16px 14px;font-size:13px}
.band-grid span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.band-grid .money{font-family:var(--mono);font-variant-numeric:tabular-nums}
.band-status{all:unset;cursor:pointer;font-weight:700;align-self:center;padding:4px 10px;border-radius:6px}
.band-status.ok{color:var(--ok)} .band-status.bad{color:var(--bad);background:var(--bad-bg)}
.band-status:focus-visible{outline:2px solid var(--accent)}
a.lnk{color:var(--accent);text-decoration:none;font-weight:500} a.lnk:hover{text-decoration:underline}
.msg{padding:8px 12px;border-radius:6px;font-size:13px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.info{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input,.toolbar select{width:auto;flex:1;min-width:160px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.list li > span{min-width:0;overflow-wrap:anywhere}
.list small{color:var(--muted);display:block}
main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:821px){main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side-sec{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side-list{max-height:180px}
  nav.rail{flex-direction:row;overflow-x:auto;padding:6px max(16px,env(safe-area-inset-left,0px))}
  nav.rail .flow,nav.rail .subflow{display:none} nav.rail button{white-space:nowrap;padding:8px 12px;border-radius:6px}
  .side-foot{display:none}
}
h1{font-size:22px;letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:70ch}
fieldset.lock{border:0;margin:0;padding:0;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head .code{font:12px var(--mono);color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px}
.grid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f .code{font:10.5px var(--mono);color:var(--muted);opacity:.8}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
input.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:auto}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg)}
button.b{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
button.b:hover{background:var(--surface-2)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.b.primary:hover{filter:brightness(1.08)}
button.b.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button.b.small{padding:3px 8px;font-size:12px}
button.b:disabled{opacity:.5;cursor:not-allowed}
button.x{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:16px;line-height:1}
button.x:hover{color:var(--bad);background:var(--bad-bg)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.ln{font:12px var(--mono);color:var(--muted);white-space:nowrap}
table.t td.m, table.t th.m{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.rollup td{background:var(--surface-2);font-weight:600}
table.t tr.sec td{background:transparent;font-weight:700;padding-top:14px;border-bottom:2px solid var(--line)}
table.t input{padding:4px 6px}
table.t .w-desc{min-width:200px} table.t .w-pay{min-width:180px} table.t .w-amt{width:110px;min-width:96px}
.tag{display:inline-block;font:11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.auto{background:var(--accent-soft);color:var(--accent)}
.mini{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mini input{width:84px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv .total{font-weight:700;color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile .v{font:600 20px var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)} .tile.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:6px;background:var(--surface-2);font-size:13px}
.checks li .ic{font-weight:700}
.checks li.ok .ic{color:var(--ok)} .checks li.error .ic{color:var(--bad)} .checks li.warn .ic{color:var(--warn)}
.checks li.error{background:var(--bad-bg)} .checks li.warn{background:var(--warn-bg)}
.checks small{display:block;color:var(--muted)}
.banner{padding:10px 14px;border-radius:6px;margin-bottom:14px;font-weight:500}
.banner.closed{background:var(--ok-bg);color:var(--ok)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.contact{display:grid;grid-template-columns:160px repeat(auto-fit,minmax(150px,1fr)) auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:700px){.contact{grid-template-columns:1fr 1fr}}
.contact .used{grid-column:1/-1;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);max-width:75ch}
pre.merge{white-space:pre-wrap;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:14px;font:13px/1.5 var(--mono);margin:0}
/* HUD-1 form: printed-paper look in both themes */
.hudwrap{overflow-x:auto;min-width:0;padding-bottom:6px}
.hud{background:var(--paper);color:var(--ink);font:11px/1.25 var(--form);width:860px;padding:22px 26px;margin:0 0 18px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hud table{border-collapse:collapse;width:100%;font:inherit}
.hud td,.hud th{border:1px solid var(--rule);padding:3px 5px;vertical-align:top}
.hud .hdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.hud .hdr h3{margin:0;font-size:16px}
.hud .omb{font-size:9.5px}
.hud .lbl{font-size:9.5px;font-weight:700;display:block;margin-bottom:2px}
.hud .box{min-height:44px}
.hud .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:92px}
.hud .inner{text-align:right;white-space:nowrap;width:92px;font-variant-numeric:tabular-nums;color:#333}
.hud .ln{width:34px;white-space:nowrap}
.hud .sh{background:var(--paper-soft);font-weight:700}
.hud .tot td{font-weight:700}
.hud .foot{display:flex;justify-content:space-between;font-size:9px;margin-top:8px}
.hud .note{font-size:9.5px;color:var(--ink)}
.hud .cb{font-size:12px}
.hud .gfe{font-size:9px;color:#444;white-space:nowrap}
.hud .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px 40px;margin-top:26px}
.hud .sig div{border-top:1px solid var(--rule);padding-top:4px}
.chequewrap{overflow-x:auto}
.cheque{background:var(--paper);color:var(--ink);width:720px;border:1px solid var(--line);border-radius:6px;padding:18px 22px;font:13px var(--form);
  background-image:repeating-linear-gradient(135deg,rgba(28,77,140,.035) 0 6px,transparent 6px 12px)}
.cheque .r{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cheque .pay{border-bottom:1px solid var(--rule);padding:6px 0;margin-top:14px;display:flex;gap:10px}
.cheque .box{border:1px solid var(--rule);padding:4px 10px;font:600 15px var(--mono)}
.cheque .micr{font:14px var(--mono);letter-spacing:.2em;margin-top:18px}
@media print{
  .top,nav.rail,.noprint{display:none!important} .shell{display:block} main{padding:0}
  .hud{border:0;box-shadow:none;page-break-after:always;width:100%} body{background:#fff}
}
button.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:block;min-width:0}
button.tile:hover{border-color:var(--accent)} button.tile:focus-visible{outline:2px solid var(--accent)}
button.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button.tile.bad{border-color:var(--bad);background:var(--bad-bg)} button.tile.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));background:var(--warn-bg)}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
#dash-tiles-inner{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mini input.due-in{width:100%}
.tl{min-width:760px} .tl-head,.tl-row{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:stretch}
.tl-ticks{position:relative;height:24px;border-bottom:1px solid var(--line)}

.tl-row{border-bottom:1px solid var(--line)}
.tl-name{all:unset;cursor:pointer;padding:6px 10px 6px 0;display:grid;min-width:0}

.feed{display:flex;flex-direction:column;max-height:440px;overflow-y:auto}

.ni:hover{background:var(--surface-2)} .ni:focus-visible{outline:2px solid var(--accent)}

.flaglink{all:unset;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--fg)}
.flaglink:hover{color:var(--accent)} .flaglink:focus-visible{outline:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.bell{display:inline-flex;gap:6px;align-items:center}

<script>

const ROLES=['Buyer','Seller','Lender','Settlement Agent','Title Underwriter','Listing Broker','Selling Broker','Mortgage Payoff Lender','HOA','Tax Collector','Clerk / Recorder','Appraiser','Surveyor','Insurance Agent','Attorney','Other'];

const GLOBAL_TABS=[['dash','Dashboard'],['crm','Contacts directory']];
const TABS=[['order','Order & property','File set up'],['contacts','Contacts','File set up'],['tracker','Closing tracker','File set up'],['prorations','Prorations','Escrow'],['taxes','Transfer & excise taxes','Escrow'],['charges','Settlement charges','Escrow'],['payoffs','Payoffs & credits','Escrow'],['ledger','Trust ledger','Escrow'],['hud','HUD-1 statement','Closing'],['codes','Field codes & merge','Closing'],['docs','Documents · Drive','General'],['audit','Audit log','General'],['settings','Rates & settings','General']];
const DRIVE='Google Drive';

/* ---------- utilities ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/[$,\s]/g,''));return isFinite(n)?n:0};
const r2=x=>{x=num(x);return Math.round(x*100+(x>0?1e-7:x<0?-1e-7:0))/100+0};
const money=n=>{n=r2(n);const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?'-$':'$')+s};
const fmtIn=(v,d=2)=>num(v).toFixed(d);
const dnum=s=>{if(!s)return null;const p=String(s).split('-').map(Number);if(p.length<3||!p[0]||!p[1]||!p[2])return null;return Date.UTC(p[0],p[1]-1,p[2])/864e5};
const dstr=n=>{if(n==null)return '';const d=new Date(n*864e5);return `${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}/${d.getUTCFullYear()}`};
const fmtDate=s=>dstr(dnum(s));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v};

function words(n){
  n=Math.round(Math.abs(n)*100);const d=Math.floor(n/100),c=n%100;
  const a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const h=x=>{let s='';if(x>=100){s+=a[Math.floor(x/100)]+' hundred';x%=100;if(x)s+=' '}if(x>=20){s+=t[Math.floor(x/10)];if(x%10)s+='-'+a[x%10]}else if(x)s+=a[x];return s};
  const sc=['',' thousand',' million',' billion'];let parts=[],i=0,x=d;if(!x)parts=['zero'];
  while(x>0){const ch=x%1000;if(ch)parts.unshift(h(ch)+sc[i]);x=Math.floor(x/1000);i++}
  const w=parts.join(' ');return w.charAt(0).toUpperCase()+w.slice(1)+' and '+String(c).padStart(2,'0')+'/100 dollars';
}

/* ---------- milestones, flags, audit ---------- */
const MS_TEMPLATE=[
  {key:'title_order',label:'Title search ordered',from:'open',days:1},
  {key:'title_back',label:'Title search / commitment back',from:'open',days:10,cap:-14},
  {key:'buyer_sheet',label:'Buyer info sheet back',from:'open',days:5,cap:-14},
  {key:'seller_sheet',label:'Seller info sheet back',from:'open',days:5,cap:-14},
  {key:'payoff',label:'Payoff letter received',from:'close',days:-7},
  {key:'survey',label:'Survey received',from:'close',days:-10},
  {key:'hoa',label:'HOA estoppel received',from:'close',days:-10},
  {key:'lender_pkg',label:'Lender closing instructions received',from:'close',days:-3},
  {key:'hud_approved',label:'HUD-1 generated and balanced',from:'close',days:-1,auto:true},
  {key:'closing',label:'Closing held',from:'close',days:0,auto:true},
  {key:'funded',label:'Funded and disbursed',from:'close',days:0,auto:true},
  {key:'recorded',label:'Deed and mortgage recorded',from:'close',days:3}];
const MS={};MS_TEMPLATE.forEach(t=>MS[t.key]=t);
const MS_MATCH={title_back:/title\s*(search|commitment|report|exam)|\bcommitment\b|\bo\s*&\s*e\b/i,buyer_sheet:/buyer.{0,15}(info|information|questionnaire)/i,
  seller_sheet:/seller.{0,15}(info|information|questionnaire)/i,payoff:/payoff/i,survey:/\bsurvey\b/i,hoa:/estoppel|\bhoa\b/i,lender_pkg:/(lender|closing)\s*(closing\s*)?(instructions|package)/i};
const MS_AUTO={hud_approved:(o,C)=>!!o.hudVersion&&!C.errors,closing:o=>o.status==='Closed',
  funded:(o,C)=>C.disb.length>0&&C.disb.every(d=>o.issued[d.key])&&Math.abs(C.fileBal)<0.005};
const newMs=t=>({key:t.key,label:t.label,status:'open',due:'',requested:'',received:'',note:'',docId:''});
function norm(o){if(!o)return o;if(!o.openedDate)o.openedDate=o.created||today();
  if(!Array.isArray(o.milestones))o.milestones=MS_TEMPLATE.map(newMs);
  else MS_TEMPLATE.forEach(t=>{if(!o.milestones.some(m=>m.key===t.key))o.milestones.push(newMs(t))});
  if(!Array.isArray(o.audit))o.audit=[];
  if(!o.tax||typeof o.tax!=='object')o.tax={state:'',locality:'',ptype:'sfr',primary:true,payer:{},addOns:[],confirmed:false};if(!o.tax.payer)o.tax.payer={};if(!Array.isArray(o.tax.addOns))o.tax.addOns=[];
  const MIG={countyDeed:'taxLocalDeed',countyMtg:'taxLocalMtg',deedStamps:'taxStateDeed',mtgStamps:'taxStateMtg',intangible:'taxOther'};
  o.items.forEach(i=>{if(MIG[i.calc]){i.calc=MIG[i.calc];if(i.line==='1206')i.desc='Other recording taxes (intangible, note taxes)'}});
  if(!o.drive)o.drive={folderId:'',folderTitle:'',folderUrl:'',docs:[]};return o}
function msDue(o,m){if(m.due)return dnum(m.due);const t=MS[m.key];if(!t)return null;const cl=dnum(o.settlementDate);
  const base=t.from==='open'?dnum(o.openedDate||o.created):cl;if(base==null)return null;let d=base+t.days;if(t.cap!=null&&cl!=null)d=Math.min(d,cl+t.cap);return d}
const msAuto=(o,C,m)=>!!(MS_AUTO[m.key]&&MS_AUTO[m.key](o,C));
const msDone=(o,C,m)=>m.status==='received'||m.status==='waived'||msAuto(o,C,m);
let MEMO=new Map();const CC=o=>{let c=MEMO.get(o);if(!c){c=compute(o);MEMO.set(o,c)}return c};
function flagsOf(o){norm(o);const F=[];if(o.status==='Closed')return F;const C=CC(o),now=dnum(today()),cl=dnum(o.settlementDate);
  if(cl==null)F.push({sev:'warn',msg:'No closing date set',tab:'order',due:null});
  else if(cl<now)F.push({sev:'error',msg:`Closing date ${dstr(cl)} has passed and the file is still open`,tab:'hud',due:cl});
  else if(cl-now<=5&&C.errors)F.push({sev:'error',msg:`Closes ${cl===now?'today':'in '+(cl-now)+' day'+(cl-now>1?'s':'')} with ${C.errors} HUD-1 issue${C.errors>1?'s':''}`,tab:'hud',due:cl});
  for(const m of o.milestones){if(msDone(o,C,m))continue;const d=msDue(o,m);if(d==null)continue;
    if(d<now)F.push({sev:'error',msg:`${m.label}: ${now-d} day${now-d>1?'s':''} overdue (due ${dstr(d)})`,tab:'tracker',due:d,key:m.key});
    else if(d-now<=3)F.push({sev:'warn',msg:`${m.label}: due ${d===now?'today':'in '+(d-now)+' day'+(d-now>1?'s':'')} (${dstr(d)})`,tab:'tracker',due:d,key:m.key})}

const FIELD_TOP={fileNo:'File number',loanNo:'Loan number',miCase:'MI case number',loanType:'Loan type',settlementDate:'Settlement date',disbursementDate:'Disbursement date',

function fieldLabel(path){const o=O(),p=path.split('.');const sub=f=>SUBF[f]||f;

  const row=o[p[0]]&&o[p[0]][+p[1]];

    case 'tax':return p[1]==='addOns'?`Local tax ${sub(p[3])}`:'Transfer tax '+({state:'state',locality:'locality',ptype:'property type',primary:'primary residence',confirmed:'rates confirmed'}[p[1]]||p[1]);case 'settings':return 'Setting '+p.slice(1).join(' ');
    case 'commission':return p[1]==='splits'?`Commission split ${sub(p[3])}`:'Commission '+sub(p[1])}
  return path}
function valDisp(path,v,isMoney){if(v==='')return '(blank)';const o=O();if(isMoney)return money(num(v));
  if(/(payeeId|contactId|earnestHolder)$/.test(path)){if(v==='agent')return 'Settlement agent';const c=o.contacts.find(x=>x.id===v);return c?(c.name||c.role):'(none)'}
  if(/docId$/.test(path)){const d=driveOf(o).docs.find(x=>x.id===v);return d?d.title:'(none)'}
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return fmtDate(v);return String(v).length>60?String(v).slice(0,57)+'…':String(v)}
function directory(){const map=new Map();
  for(const o of FILES()){norm(o);for(const c of o.contacts){const nm=(c.name||'').trim();if(!nm)continue;const k=nm.toLowerCase();let e=map.get(k);
    if(!e){e={key:k,name:nm,roles:new Set(),email:'',phone:'',address:'',ref:'',files:[]};map.set(k,e)}
    e.roles.add(c.role);['email','phone','address','ref'].forEach(f=>{if(!e[f]&&c[f])e[f]=c[f]});if(!e.files.some(x=>x.o===o))e.files.push({o,role:c.role})}}
  return [...map.values()].sort((a,b)=>b.files.length-a.files.length||a.name.localeCompare(b.name))}

function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function save(){const o=O();if(o)o.updated=Date.now();saveLocal();if(o)queueRemote(o)}
function queueRemote(o){if(!REMOTE||!o.updated)return;clearTimeout(pending.get(o.id));pending.set(o.id,setTimeout(()=>pushRemote(o.id),700))}
function pushRemote(id){pending.delete(id);const o=DB.orders.find(x=>x.id===id);if(!o||!REMOTE)return;const body=JSON.parse(JSON.stringify(o));
  writeChain=writeChain.then(()=>REMOTE.collection('orders').doc(id).set(body)).then(()=>{if(SYNC!=='error'){SYNC='synced'}refresh()},syncFail)}
function removeRemote(id){if(!REMOTE)return;writeChain=writeChain.then(()=>REMOTE.collection('orders').doc(id).delete()).catch(syncFail)}
function syncFail(e){const c=e&&e.code;SYNC='error';
  SYNCMSG=c==='quota_exceeded'?'The shared file store is full. Delete closed files you no longer need.':
    c==='invalid_argument'?'You have view-only access. Changes stay in this browser.':
    c==='revoked'?'Access to the shared store ended. Changes stay in this browser.':'Could not reach the shared store. Changes are kept in this browser.';refresh()}
const validOrder=r=>r&&typeof r==='object'&&Array.isArray(r.items)&&Array.isArray(r.contacts)&&r.settings&&r.property&&r.commission;
const isTyping=()=>{const a=document.activeElement;return !!(a&&a.matches&&a.matches('main input, main textarea, main select'))};
function onRemote(snap){
  if(SYNC!=='error')SYNC='synced';
  const remote=snap.docs.filter(d=>d.exists).map(d=>({...d.data(),id:d.id})).filter(validOrder);
  const ids=new Set(remote.map(r=>r.id));remote.forEach(r=>seenRemote.add(r.id));
  const cur=DB.current;let replaced=false;
  const next=remote.map(r=>{const l=DB.orders.find(x=>x.id===r.id);if(l&&(l.updated||0)>=(r.updated||0))return l;if(r.id===cur)replaced=true;return JSON.parse(JSON.stringify(r))});
  DB.orders.forEach(l=>{if(ids.has(l.id))return;if(seenRemote.has(l.id)&&!pending.has(l.id))return;next.push(l);if(!migrated&&l.updated)queueRemote(l)});
  migrated=true;if(!next.length)next.push(newOrder());
  DB.orders=next;if(!next.find(x=>x.id===DB.current)){DB.current=next[0].id;replaced=true}
  saveLocal();refreshNames();if(replaced&&!isTyping())render();else refresh();
}
function saveCfg(){try{localStorage.setItem(KEY+'-cfg',JSON.stringify(CFG))}catch(e){}
  if(REMOTE)REMOTE.doc('config/app').set({...CFG}).catch(syncFail)}
function pushRecent(id){RECENT=[id,...RECENT.filter(x=>x!==id)].slice(0,12);try{localStorage.setItem(KEY+'-recent',JSON.stringify(RECENT))}catch(e){}}
const driveOf=o=>o.drive||(o.drive={folderId:'',folderTitle:'',folderUrl:'',docs:[]});
function refreshNames(){if(!USER)return;const ids=[...new Set(DB.orders.flatMap(o=>(o.audit||[]).map(a=>a.by)).filter(id=>id&&id!==ME&&!(id in NAMES)))].slice(0,64);
  if(!ids.length)return;USER.profiles(ids).then(ps=>{ids.forEach(id=>{NAMES[id]=(ps&&ps[id]&&ps[id].name)||''});refresh()}).catch(()=>{})}

const TAX_AS_OF='Built-in rules reflect state statutes and common local rates as known in mid-2025.';
function taxFormula(f,base){
  if(f.pct!=null)return r2(base*f.pct/100);
  if(f.per){const taxable=Math.max(0,base-num(f.exempt));if(f.mode==='marginalPer'){let prev=0,t=0;for(const [cap,rate] of f.tiers){const c=cap>0?cap:Infinity;const slice=Math.min(base,c)-prev;if(slice<=0)break;t+=Math.ceil(slice/f.per)*rate;prev=c}return r2(t)}
    let amt=(f.up===false?taxable/f.per:Math.ceil(taxable/f.per))*f.rate;if(taxable>0&&f.min)amt=Math.max(amt,f.min);if(f.max)amt=Math.min(amt,f.max);return r2(amt)}
  if(f.mode==='marginal'){let prev=0,t=0;for(const [cap,p] of f.tiers){const c=cap>0?cap:Infinity;const slice=Math.min(base,c)-prev;if(slice<=0)break;t+=slice*p/100;prev=c}return r2(t)}
  if(f.mode==='whole'){for(const [cap,p] of f.tiers){if(cap<=0||base<=cap)return r2(base*p/100)}}
  return 0}
function taxState(o){const t=o.tax||{};const s=(t.state||String(o.property.state||'').trim().toUpperCase()).slice(0,2);return TAX_RULES[s]?s:''}
function taxCalc(o){
  const t=o.tax,st=taxState(o),rule=TAX_RULES[st];const price=num(o.salesPrice),loan=num(o.loanAmount);
  const x={price,loan,loc:t.locality||'',ptype:t.ptype||'sfr',primary:t.primary!==false};
  const bases={price,net:Math.max(0,price-num(o.existingLoan)),loan};
  const R={state:st,rule,comps:[],slots:{}};Object.keys(TAX_SLOTS).forEach(k=>R.slots[k]={b:0,s:0});

function tiered(amount,tiers){
  amount=Math.ceil(num(amount)/1000)*1000;let prev=0,p=0;

  return r2(p);

function prorate(p,P,S){

  const period=e-s+1;const basis=S.prorationBasis==='365'?365:period;r.daily=a/basis;
  let sd=P-s+(S.buyerOwnsDay!==false?0:1);sd=Math.max(0,Math.min(period,sd));r.sDays=sd;r.bDays=period-sd;
  if(p.status==='unpaid'){r.amt=r2(r.daily*sd);r.from=s;r.to=s+sd-1}else{r.amt=r2(r.daily*r.bDays);r.from=s+sd;r.to=e}
  r.ok=true;return r;
}

function compute(o){
  const S=o.settings,C={it:{},roll:{},L:{},pr:{},adjLines:{},payLines:{},checks:[]};
  const price=num(o.salesPrice),loan=num(o.loanAmount),D=num(o.earnestMoney);
  const byId=id=>o.contacts.find(c=>c.id===id);
  C.cname=id=>{const c=byId(id);return c?(c.name||`(${c.role}, unnamed)`):''};
  C.hname=id=>{const c=byId(id);return c&&c.name?c.name:''};
  C.names=role=>o.contacts.filter(c=>c.role===role&&c.name).map(c=>c.name).join(' and ');
  C.first=role=>o.contacts.find(c=>c.role===role);
  const isLender=id=>{const c=byId(id);return!!c&&c.role==='Lender'};

  const owner=price>0?tiered(price,S.tiers):0;let lenderP=0;
  if(loan>0){lenderP=S.simultaneous&&price>0?r2(num(S.simulFee)+Math.max(0,tiered(loan,S.tiers)-tiered(price,S.tiers))):tiered(loan,S.tiers)}
  C.ownerPrem=owner;C.lenderPrem=lenderP;

  const ii={from:null,to:null,perDiem:0,days:0,amt:0};const Dd=dnum(o.disbursementDate||o.settlementDate);
  if(Dd!=null&&loan>0&&num(o.interestRate)>0){const d=new Date(Dd*864e5);const fn=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)/864e5;
    ii.days=fn-Dd;ii.perDiem=r2(loan*num(o.interestRate)/100/(num(S.interestBasis)||365));ii.amt=r2(ii.perDiem*ii.days);ii.from=Dd;ii.to=fn}
  C.interest=ii;
  const calcAmt=it=>{switch(it.calc){
    case 'interest':return ii.amt;case 'reserve':return r2(num(it.months)*num(it.monthly));
    case 'ownerTitle':return owner;case 'lenderTitle':return lenderP;
    case 'deedStamps':return stamps(price,S.deedRate);case 'countyDeed':return stamps(price,S.countyDeedRate);
    case 'mtgStamps':return stamps(loan,S.mtgRate);case 'countyMtg':return stamps(loan,S.countyMtgRate);
    case 'intangible':return r2(loan*num(S.intangiblePct)/100)}return 0};

  C.tax=taxCalc(norm(o));

  for(const it of o.items){

    if(TAX_CALCS[it.calc]&&!it.override){const sl=C.tax.slots[TAX_CALCS[it.calc]];b=sl.b;s=sl.s}
    else if(it.calc&&(!it.override||it.calc==='reserve')){const a=calcAmt(it);if(it.party==='S'){b=0;s=a}else if(it.party==='split'){b=r2(a/2);s=r2(a-b)}else{b=a;s=0}}
    if(it.bOnly)s=0;b=r2(b);s=r2(s);C.it[it.id]={b,s};

  C.splits=cm.splits.map(sp=>({...sp,amt:r2(C.commTotal*num(sp.pct)/100)}));
  C.splitPct=cm.splits.reduce((a,x)=>a+num(x.pct),0);
  C.commPaid=r2(C.splits.reduce((a,x)=>a+x.amt,0));
  C.commB=cm.payer==='B'?C.commPaid:0;C.commS=cm.payer==='B'?0:C.commPaid;
  C.B1400=r2(B+C.commB);C.S1400=r2(Sx+C.commS);

  const holder=o.earnestHolder||'agent';let retained=0,excess=0;
  if(holder!=='agent'&&D>0){const sp=C.splits.find(x=>x.contactId===holder);retained=Math.min(D,sp?sp.amt:0);excess=r2(D-retained)}
  C.retained=r2(retained);C.excess=excess;C.holder=holder;

  const L=C.L,used=new Set([504,505]);

  setL(101,DEF[101],price);setL(401,DEF[401],price);
  if(num(o.personalProperty)){setL(102,DEF[102],o.personalProperty);setL(402,DEF[402],o.personalProperty)}
  setL(103,DEF[103],C.B1400);setL(201,DEF[201],D);setL(202,DEF[202],loan);
  if(num(o.existingLoan)){setL(203,DEF[203],o.existingLoan);setL(503,DEF[503],o.existingLoan)}
  if(excess)setL(501,DEF[501],excess);setL(502,DEF[502],C.S1400);
  const alloc=(sides,prefs)=>{for(const suf of prefs){if(sides.every(b=>ALLOW[b].includes(suf)&&!used.has(b+suf))){sides.forEach(b=>used.add(b+suf));return suf}}return null};

    const paid=p.status!=='unpaid';const bases=paid?[100,400]:[200,500];
    let suf=null;

    if(suf==null)suf=alloc(bases,paid?DEFPREF:UNPAIDPREF);
    if(suf==null){C.unplaced.push(desc);continue}

    const amt=num(p.amount);if(!amt)return;let line=i<2&&!L[504+i]?504+i:null;

    used.add(line);const nm=C.cname(p.payeeId);L[line]={desc:(p.desc||'Payoff')+(nm?' to '+nm:''),amt:r2(amt)};C.payLines[p.id]=line;
  });
  o.adjustments.forEach(a=>{
    const amt=num(a.amount);if(!amt)return;const t=ADJ_TYPES[a.type];if(!t)return;
    const suf=alloc(t.sides,DEFPREF);if(suf==null){C.unplaced.push(a.desc);return}
    const nm=C.cname(a.payeeId);const desc=(a.desc||t.label)+(t.sides.length===1&&nm?(t.sides[0]===200||t.sides[0]===400?' from ':' to ')+nm:'');
    t.sides.forEach(b=>{L[b+suf]={desc,amt:r2(amt)}});C.adjLines[a.id]=t.sides.map(b=>b+suf);
  });
  const sum=(a,b)=>{let t=0;for(let n=a;n<=b;n++)if(L[n])t+=L[n].amt;return r2(t)};
  setL(120,DEF[120],sum(101,112));setL(220,DEF[220],sum(201,219));setL(420,DEF[420],sum(401,412));setL(520,DEF[520],sum(501,519));
  setL(301,DEF[301],L[120].amt);setL(302,DEF[302],L[220].amt);setL(303,DEF[303],r2(L[120].amt-L[220].amt));
  setL(601,DEF[601],L[420].amt);setL(602,DEF[602],L[520].amt);setL(603,DEF[603],r2(L[420].amt-L[520].amt));

  /* trust ledger: expected receipts and disbursements derived from the statement */
  const DM=new Map(),exp=[];
  const pkey=id=>id&&byId(id)?'p:'+id:'nopayee';
  const addD=(key,payeeId,name,amt,ref)=>{amt=r2(amt);if(!amt)return;let d=DM.get(key);if(!d){d={key,payeeId,name:key==='nopayee'?'No payee assigned':name,amt:0,refs:[]};DM.set(key,d)}d.amt=r2(d.amt+amt);d.refs.push(ref)};
  const uw=C.first('Title Underwriter');let netted=0;const nettedRefs=[];
  const lineLabel=it=>`${it.line}${it.sub?' '+it.sub:''} ${it.desc||''}`.trim();
  for(const it of o.items){
    const {b,s}=C.it[it.id];const t=r2(b+s);if(!t)continue;const ref=lineLabel(it);
    if(S.lenderNets&&isLender(it.payeeId)){netted=r2(netted+t);nettedRefs.push(ref);continue}
    if(it.calc==='ownerTitle'||it.calc==='lenderTitle'){const ag=r2(t*num(S.agentPct)/100);
      addD(pkey(it.payeeId),it.payeeId,C.cname(it.payeeId),ag,ref+' (agent portion)');
      addD(uw?pkey(uw.id):'nopayee',uw&&uw.id,uw?C.cname(uw.id):'',r2(t-ag),ref+' (underwriter portion)');continue}
    addD(pkey(it.payeeId),it.payeeId,C.cname(it.payeeId),t,ref);
  }
  C.splits.forEach(sp=>{const ret=sp.contactId===holder?C.retained:0;addD(pkey(sp.contactId),sp.contactId,C.cname(sp.contactId),r2(sp.amt-ret),'703 Commission'+(ret?` (net of ${money(ret)} deposit held)`:''))});
  o.payoffs.forEach(p=>{if(num(p.amount)&&C.payLines[p.id])addD(pkey(p.payeeId),p.payeeId,C.cname(p.payeeId),p.amount,`${C.payLines[p.id]} ${p.desc}`)});
  o.adjustments.forEach(a=>{const ln=C.adjLines[a.id];if(!ln)return;const t=a.type;
    if(t==='buyerDebit'||t==='sellerDebit')addD(pkey(a.payeeId),a.payeeId,C.cname(a.payeeId),a.amount,`${ln[0]} ${a.desc}`);

  else if(L[303].amt<0){const b0=C.first('Buyer');addD('buyer',b0&&b0.id,buyers,-L[303].amt,'303 Cash to borrower')}

function itemRow(it,i){

  if(it.line==='902')desc+=`<div class="mini">for ${inp(`${p}.months`,{ph:'months'})} months</div>`;
  if(it.line==='903')desc+=`<div class="mini">for ${inp(`${p}.years`,{ph:'years'})} years</div>`;
  if(it.calc==='interest')desc+=`<div class="mini">${out(C=>{const x=C.interest;return x.days?`${dstr(x.from)} to ${dstr(x.to)}, ${x.days} days @ ${money(x.perDiem)}/day`:'Needs loan amount, rate and disbursement date'})}</div>`;

  let opts='';
  if(TAX_CALCS[it.calc]){opts+=`<span class="tag auto">state rules</span> `;if(!it.override)opts+=`<button class="b small" data-act="tab" data-tab="taxes">Worksheet</button>`;

  else if(it.calc&&it.calc!=='reserve'){opts+=`<span class="tag auto">calc</span> `;
    if(!it.override)opts+=sel(`${p}.party`,[['B','Borrower'],['S','Seller'],['split','Split 50/50']],{re:true});
    opts+=`<label class="check" style="font-size:12px"><input id="${fid(p+'.override')}" type="checkbox" data-bind="${p}.override" data-re="1"${it.override?' checked':''}> Override</label>`}

  if(it.gfe)opts+=` <span class="tag">GFE ${esc(it.gfe)}</span>`;

  <td class="w-amt">${cell('b')}</td><td class="w-amt">${it.bOnly?'<span class="empty">—</span>':cell('s')}</td>

}

<h1>Dashboard</h1><p class="lede">Open files, the closing schedule and everything that needs action. Click a tile to filter the files, or click any alert to jump straight to the screen that fixes it.</p>
<div class="stack">
${out(()=>{const open=FILES().filter(o=>o.status!=='Closed');
  const wk=open.filter(dfilterFn('week')).length,m30=open.filter(dfilterFn('soon30')).length,flag=FILES().filter(dfilterFn('flagged')).length;
  const due=FILES().reduce((a,o)=>a+flagsOf(o).filter(f=>f.sev==='warn').length,0);const over=FILES().reduce((a,o)=>a+flagsOf(o).filter(f=>f.sev==='error'&&f.tab==='tracker').length,0);
  const cm=FILES().filter(dfilterFn('closedMonth')).length;
  return `<div class="tiles" id="dash-tiles-inner">${dtile('open','dash-files','Open files',open.length,`${FILES().length} file${FILES().length===1?'':'s'} in total`)}
  ${dtile('week','dash-files','Closing this week',wk,'Next 7 days')}${dtile('soon30','dash-timeline','Closing in 30 days',m30,'See the schedule')}
  ${dtile('flagged','dash-flags','Need attention',flag,`${over} overdue item${over===1?'':'s'}`,flag?'bad':'')}
  ${dtile('flagged','dash-notes','Coming due',due,'Due in the next 3 days',due?'warn':'')}${dtile('closedMonth','dash-files','Closed this month',cm,new Date().toLocaleString('en-US',{month:'long'}))}</div>`},'div','dash-tiles-wrap')}
<section class="panel" id="dash-flags"><div class="panel-head"><h2>Files that need attention</h2>${out(()=>{const n=FILES().filter(dfilterFn('flagged')).length;return n?`<span class="pill bad">${n} flagged</span>`:'<span class="pill ok">All clear</span>'})}</div>
 ${out(()=>{const fl=FILES().map(o=>({o,f:flagsOf(o).filter(x=>x.sev==='error')})).filter(x=>x.f.length).sort((a,b)=>(dnum(a.o.settlementDate)??9e9)-(dnum(b.o.settlementDate)??9e9));
  return fl.length?fl.map(({o,f})=>`<div class="flagfile"><div><b style="font-family:var(--mono)">${esc(o.fileNo||'Untitled')}</b> · ${esc(propAddr(o)||'No address')}<br><span class="note">Closing ${esc(fmtDate(o.settlementDate)||'not set')} · ${esc(CC(o).names('Buyer')||'No buyer')}</span></div>
   <button class="b small primary" data-act="openFile" data-id="${o.id}" data-tab="${f[0].tab}">Open file</button>
   <div class="fl">${f.map(x=>`<button class="flaglink" data-act="openFile" data-id="${o.id}" data-tab="${x.tab}"><span class="sv error"></span><span>${esc(x.msg)} →</span></button>`).join('')}</div></div>`).join('')
   :'<p class="empty">No file has an overdue item, a passed closing date or an unbalanced HUD-1 near closing.</p>'},'div')}
</section>
<section class="panel" id="dash-timeline"><div class="panel-head"><h2>Closing schedule</h2><div class="legend"><span><i class="dia"></i>Closing</span><span><i style="background:var(--ok)"></i>Done</span><span><i style="background:var(--warn)"></i>Due in 3 days</span><span><i style="background:var(--bad)"></i>Overdue</span><span><i style="background:var(--muted)"></i>Upcoming</span></div></div>
 ${out(()=>{const rows=FILES().filter(o=>o.status!=='Closed').sort((a,b)=>(dnum(a.settlementDate)??9e9)-(dnum(b.settlementDate)??9e9));
  return rows.length?timeline(rows)+`<p class="note">Last week through the next six weeks. Hover a dot for the item; click a file to open its tracker.</p>`:'<p class="empty">No open files. Click New file to start one.</p>'},'div')}
</section>
<div class="two">
<section class="panel" id="dash-notes"><div class="panel-head"><h2>Notifications</h2>${out(()=>{const n=notifications();return `<span class="note">${n.filter(x=>x.sev!=='info').length} alerts · ${n.filter(x=>x.sev==='info').length} automation updates</span>`})}</div>
 ${out(()=>{const n=notifications().slice(0,40);return n.length?n.map(x=>`<button class="ni" data-act="openFile" data-id="${x.o.id}" data-tab="${x.tab}"><span class="sv ${x.sev}"></span><span>${esc(x.msg)}<small>${esc(x.o.fileNo||'Untitled')} · ${esc(x.o.property.street||'No address')}</small></span><span class="when">${x.at?esc(new Date(x.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})):x.due!=null?esc(dstr(x.due).slice(0,5)):''}</span></button>`).join(''):'<p class="empty">No alerts. Everything on open files is on track.</p>'},'div','feed')}
</section>
<section class="panel"><div class="panel-head"><h2>Coming up · next 14 days</h2></div>
 ${out(()=>{const now=dnum(today());const it=[];for(const o of FILES()){if(o.status==='Closed')continue;const C=CC(o);
   for(const m of norm(o).milestones){const d=msDue(o,m);if(d==null||d<now||d>now+14||msDone(o,C,m))continue;it.push({d,o,label:m.label,tab:'tracker'})}
   const cl=dnum(o.settlementDate);if(cl!=null&&cl>=now&&cl<=now+14)it.push({d:cl,o,label:'Closing',tab:'hud',cl:true})}
  it.sort((a,b)=>a.d-b.d||(b.cl?1:0)-(a.cl?1:0));
  return it.length?`<div class="feed">${it.slice(0,40).map(x=>`<button class="ni" data-act="openFile" data-id="${x.o.id}" data-tab="${x.tab}"><span class="sv ${x.cl?'info':x.d-now<=3?'warn':'ok'}"></span><span>${x.cl?'<b>Closing</b>':esc(x.label)}<small>${esc(x.o.fileNo||'Untitled')} · ${esc(x.o.property.street||'No address')}</small></span><span class="when">${x.d===now?'Today':esc(dstr(x.d).slice(0,5))}</span></button>`).join('')}</div>`:'<p class="empty">Nothing due in the next two weeks.</p>'},'div')}
</section></div>
<section class="panel" id="dash-files"><div class="panel-head"><h2>Files</h2><button class="b small primary" data-act="newOrder">New file</button></div>
 <div class="toolbar"><input id="dash-q" type="search" placeholder="Search file #, address, party, parcel" aria-label="Search files" value="${esc(UI.dq)}">
  ${out(()=>`<select id="dash-status" data-change="dashStatus" aria-label="Filter files">${DFILTERS.map(([v,l])=>`<option value="${v}"${UI.dfilter===v?' selected':''}>${l}</option>`).join('')}</select>`,'span')}</div>
 ${out(()=>{const rows=FILES().filter(dfilterFn(UI.dfilter)).filter(o=>matchQ(o,UI.dq)).sort((a,b)=>(dnum(a.settlementDate)??1e9)-(dnum(b.settlementDate)??1e9));
  if(!rows.length)return `<p class="empty">${FILES().length?'No files match this filter.':'No files yet. Click New file to open your first order.'}</p>`;
  return `<div class="scroll"><table class="t"><thead><tr><th>File</th><th>Property</th><th>Buyer / seller</th><th>Closing</th><th>Next item</th><th class="m">Cash from borrower</th><th>Status</th><th>Drive</th><th></th></tr></thead><tbody>
  ${rows.map(o=>{const C=CC(o),d=driveOf(o),fl=flagsOf(o),err=fl.filter(x=>x.sev==='error').length;
   const nx=o.milestones.map(m=>({m,d:msDue(o,m)})).filter(x=>x.d!=null&&!msDone(o,C,x.m)).sort((a,b)=>a.d-b.d)[0];
   return `<tr><td class="ln"><b>${esc(o.fileNo||'Untitled')}</b></td><td>${esc(propAddr(o)||'—')}</td>
   <td>${esc(C.names('Buyer')||'—')}<br><span class="note">${esc(C.names('Seller')||'—')}</span></td><td style="white-space:nowrap">${esc(fmtDate(o.settlementDate)||'—')}</td>
   <td>${nx?`${esc(nx.m.label)}<br><span class="note">${dstr(nx.d)}</span>`:'<span class="note">Nothing open</span>'}</td>
   <td class="m">${money(Math.max(0,C.L[303].amt))}</td>
   <td>${o.status==='Closed'?'<span class="pill ok">Closed</span>':err?`<span class="pill bad">${err} flag${err>1?'s':''}</span>`:fl.length?`<span class="pill warn">${fl.length} due soon</span>`:'<span class="pill neutral">On track</span>'}</td>
   <td>${d.folderUrl?`<a class="lnk" href="${esc(d.folderUrl)}" target="_blank" rel="noopener">Folder</a> · ${d.docs.length}`:'<span class="note">Not linked</span>'}</td>
   <td><button class="b small" data-act="openFile" data-id="${o.id}">Open</button></td></tr>`}).join('')}</tbody></table></div>`},'div')}
</section>
<div class="two">
<section class="panel"><div class="panel-head"><h2>Recent activity</h2><span class="note">Audit trail across all files</span></div>
 ${out(()=>{const a=FILES().flatMap(o=>(norm(o).audit||[]).slice(0,40).map(x=>({...x,o}))).sort((x,y)=>y.at-x.at).slice(0,15);
  return a.length?`<div class="feed">${a.map(x=>`<button class="ni" data-act="openFile" data-id="${x.o.id}" data-tab="audit"><span class="sv ${x.kind==='auto'?'info':x.kind==='money'?'ok':x.kind==='status'?'warn':''}"${x.kind==='edit'||x.kind==='doc'?' style="background:var(--muted)"':''}></span><span>${esc(x.msg)}<small>${esc(x.o.fileNo||'Untitled')} · ${esc(whoName(x.by))}</small></span><span class="when">${esc(new Date(x.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</span></button>`).join('')}</div>`:'<p class="empty">No activity recorded yet.</p>'},'div')}
</section>
<section class="panel"><div class="panel-head"><h2>Recent documents</h2></div>
 ${out(()=>{const docs=FILES().flatMap(o=>driveOf(o).docs.map(d=>({...d,o}))).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,10);
  return docs.length?`<ul class="list">${docs.map(d=>`<li><span><a class="lnk" href="${esc(d.url||'#')}" target="_blank" rel="noopener">${esc(d.title)}</a><small>${esc(d.kind)} · ${esc(d.o.fileNo||'Untitled')} · ${esc(d.at?new Date(d.at).toLocaleDateString('en-US'):'')}</small></span><button class="b small" data-act="openFile" data-id="${d.o.id}" data-tab="docs">Open file</button></li>`).join('')}</ul>`:'<p class="empty">No documents yet. Save a HUD-1 or attach a Drive file from a file’s Documents screen.</p>'},'div')}
</section></div>
</div>`;

PANELS.tracker=()=>{const o=O();return `
<h1>Closing tracker</h1><p class="lede">Every milestone for this file. Due dates come from the open date and the closing date unless you set one. Overdue items flag the file on the dashboard. Items tagged <span class="tag auto">auto</span> complete themselves from the HUD-1 and the trust ledger, and items tagged <span class="tag">Drive match</span> complete when a matching document reaches the file’s Drive folder.</p>
<div class="stack">
<section class="panel"><div class="grid">${fld('File opened',inp('openedDate',{type:'date'}))}${fld('Settlement date',inp('settlementDate',{type:'date'}),'Order.ClosingDate')}
 ${out(C=>{const done=o.milestones.filter(m=>msDone(o,C,m)).length;return `<div class="f"><span>Progress</span><b style="font-size:18px;color:var(--fg)">${done} of ${o.milestones.length} done</b></div>`},'div')}</div>
 ${out(()=>timeline([o]),'div')}</section>
<section class="panel"><div class="scroll"><table class="t">
 <thead><tr><th>Milestone</th><th>Due</th><th>Status</th><th>Requested</th><th>Received</th><th>Document</th><th>Note</th><th></th></tr></thead><tbody>
 ${o.milestones.map((m,i)=>`<tr>
  <td class="w-desc">${MS[m.key]?`<b>${esc(m.label)}</b>`:inp(`milestones.${i}.label`,{ph:'Milestone name'})}${MS[m.key]&&MS[m.key].auto?' <span class="tag auto">auto</span>':''}${MS_MATCH[m.key]?' <span class="tag" title="Marked received when a matching Drive document appears">Drive match</span>':''}</td>
  <td>${out(()=>{const d=msDue(o,m);return d!=null?`<b style="white-space:nowrap">${dstr(d)}</b>${m.due?'<br><span class="note">set by hand</span>':`<br><span class="note">${MS[m.key]?(MS[m.key].from==='open'?'from open date':'from closing'):''}</span>`}`:'<span class="note">Needs closing date</span>'})}
   <div class="mini" style="min-width:140px">${inp(`milestones.${i}.due`,{type:'date',cls:'due-in'})}</div></td>
  <td style="min-width:150px">${sel(`milestones.${i}.status`,[['open','Not started'],['requested','Requested'],['received','Received'],['waived','Waived / N.A.']],{re:true})}</td>
  <td>${inp(`milestones.${i}.requested`,{type:'date'})}</td><td>${inp(`milestones.${i}.received`,{type:'date'})}</td>
  <td class="w-pay">${sel(`milestones.${i}.docId`,[['','— Link a document —'],...driveOf(o).docs.map(d=>[d.id,d.title])],{re:true})}</td>
  <td class="w-desc">${inp(`milestones.${i}.note`,{ph:'Note'})}</td>
  <td>${out(C=>{const d=msDue(o,m),now=dnum(today());if(msDone(o,C,m))return `<span class="pill ok">${msAuto(o,C,m)&&m.status!=='received'?'Done · auto':m.status==='waived'?'Waived':m.auto?'Done · auto':'Done'}</span>`;
    if(d==null)return '<span class="pill neutral">No date</span>';if(d<now)return `<span class="pill bad">${now-d}d overdue</span>`;if(d-now<=3)return '<span class="pill warn">Due soon</span>';return '<span class="pill neutral">On track</span>'})}
   ${MS[m.key]?'':`<button class="x" data-act="delRow" data-list="milestones" data-i="${i}" aria-label="Remove milestone">×</button>`}</td></tr>`).join('')}
 </tbody></table></div>
 <div class="row-actions"><button class="b" data-act="addMilestone">Add milestone</button>${driveOf(o).folderId?busyBtn('list','Check Drive folder for documents','driveList'):'<span class="note">Link a Drive folder on Documents to turn on document matching.</span>'}</div>
 <p class="note">Setting a status to Received fills in today’s date. Linking a document marks the item received. When the Drive folder is checked, documents named like “Title commitment”, “Buyer info sheet”, “Seller information sheet”, “Payoff”, “Survey” or “Estoppel” mark their item received automatically, and the change is written to the audit log.</p>
</section></div>`};

PANELS.audit=()=>{const o=O();const kinds=[['all','All activity'],['edit','Field edits'],['money','Money'],['doc','Documents & HUD'],['status','File status'],['auto','Automation']];return `
<h1>Audit log</h1><p class="lede">Who changed what on this file and when. Entries are added automatically for every field change, receipt, check, wire, HUD-1 version, document and automation action. They cannot be edited.</p>
<section class="panel"><div class="toolbar"><select id="audit-kind" data-change="auditKind" aria-label="Filter activity">${kinds.map(([v,l])=>`<option value="${v}"${UI.akind===v?' selected':''}>${l}</option>`).join('')}</select></div>
 ${out(()=>{const a=o.audit.filter(x=>UI.akind==='all'||x.kind===UI.akind);return a.length?`<div class="scroll"><table class="t"><thead><tr><th>When</th><th>Who</th><th>Type</th><th>What happened</th></tr></thead><tbody>
  ${a.map(x=>`<tr><td class="ln" style="white-space:nowrap">${esc(new Date(x.at).toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'}))}</td><td>${esc(whoName(x.by))}</td><td><span class="tag${x.kind==='auto'?' auto':''}">${esc(x.kind)}</span></td><td>${esc(x.msg)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No activity of this type yet.</p>'},'div')}
 <p class="note">The newest 400 entries are kept on each file.</p></section>`};

PANELS.crm=()=>{const roles=['all',...ROLES];return `
<h1>Contacts directory</h1><p class="lede">Every person and company across all files, combined by name. See which files each one is on, open those files, and add a contact to the file you have open without retyping their details.</p>
<section class="panel"><div class="toolbar"><input id="crm-q" type="search" placeholder="Search name, email, phone, company" aria-label="Search contacts" value="${esc(UI.cq)}">
 <select id="crm-role" data-change="crmRole" aria-label="Filter by role">${roles.map(r=>`<option value="${esc(r)}"${UI.crole===r?' selected':''}>${r==='all'?'All roles':esc(r)}</option>`).join('')}</select></div>
 ${out(()=>{const q=UI.cq.toLowerCase().trim();const cur=O();const all=directory();const list=all.filter(e=>(UI.crole==='all'||e.roles.has(UI.crole))&&(!q||[e.name,e.email,e.phone,e.address,e.ref].join(' ').toLowerCase().includes(q)));
  if(!list.length)return `<p class="empty">${all.length?'No contacts match.':'No named contacts yet. Names typed on any file’s Contacts screen appear here.'}</p>`;
  return `<div class="scroll"><table class="t"><thead><tr><th>Name</th><th>Roles</th><th>Phone / email</th><th class="m">Files</th><th>Next closing</th><th></th></tr></thead><tbody>
  ${list.map(e=>{const open=e.files.filter(f=>f.o.status!=='Closed');const now=dnum(today());const nx=open.map(f=>dnum(f.o.settlementDate)).filter(d=>d!=null&&d>=now).sort((a,b)=>a-b)[0];
   const onCur=e.files.some(f=>f.o===cur);const exp=UI.crmOpen===e.key;
   return `<tr${exp?' class="hl"':''}><td><b>${esc(e.name)}</b>${e.address?`<br><span class="note">${esc(e.address)}</span>`:''}</td><td><div class="chips">${[...e.roles].map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</div></td>
    <td>${esc(e.phone||'—')}<br><span class="note">${esc(e.email||'')}</span></td><td class="m">${e.files.length}${open.length!==e.files.length?`<br><span class="note">${open.length} open</span>`:''}</td><td>${nx!=null?dstr(nx):'—'}</td>
    <td><div class="row-actions" style="flex-wrap:nowrap"><button class="b small" data-act="crmToggle" data-key="${esc(e.key)}">${exp?'Hide files':'Show files'}</button>${onCur?`<span class="pill ok">On ${esc(cur.fileNo||'open file')}</span>`:`<button class="b small" data-act="crmAdd" data-key="${esc(e.key)}">Add to ${esc(cur.fileNo||'open file')}</button>`}</div></td></tr>
    ${exp?`<tr class="hl"><td colspan="6"><ul class="list">${e.files.map(f=>`<li><span><b>${esc(f.o.fileNo||'Untitled')}</b> · ${esc(f.role)} · ${esc(propAddr(f.o)||'No address')}<small>Closing ${esc(fmtDate(f.o.settlementDate)||'not set')} · ${esc(f.o.status)}${flagsOf(f.o).some(x=>x.sev==='error')?' · flagged':''}</small></span><button class="b small" data-act="openFile" data-id="${f.o.id}" data-tab="contacts">Open file</button></li>`).join('')}</ul></td></tr>`:''}`}).join('')}
  </tbody></table></div>`},'div')}
 <p class="note">Contacts are matched by exact name. Use the same spelling on every file so each contact's history stays together.</p></section>`};

/* ---------- Google Drive (viewer's claude.ai connector) ---------- */
const qs=v=>String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const filesOf=p=>(p&&Array.isArray(p.files))?p.files:[];
const createdOf=p=>p&&(p.id?p:(p.file&&p.file.id?p.file:null));
const MIME={'application/vnd.google-apps.folder':'Folder','application/vnd.google-apps.document':'Google Doc','application/vnd.google-apps.spreadsheet':'Google Sheet','application/vnd.google-apps.presentation':'Google Slides','application/pdf':'PDF'};
const mimeLabel=m=>MIME[m]||(m&&m.startsWith('image/')?'Image':m?m.split('/').pop():'File');
async function drive(tool,input){if(!MCP)throw{code:'no_mcp'};const r=await MCP.callTool(DRIVE,tool,input);return r.payload}
function driveFail(e,write){const c=e&&e.code;
  const M={no_mcp:'Google Drive is only available when this page is open in claude.ai with your Google Drive connector.',
    needs_reauth:'Reconnect Google Drive in claude.ai Settings → Connectors, then try again.',
    server_not_connected:'Add the Google Drive connector in claude.ai Settings → Connectors, then try again.',
    selection_required:'You have more than one Google Drive connector. Choose one when claude.ai asks, then try again.',
    not_in_manifest:'Google Drive is turned off for this page. Turn it on from the artifact’s Permissions menu.',
    approval_required:'Google Drive needs your approval. Click the button again and choose Allow.',
    blocked_by_policy:'Your organization blocks this Google Drive action.',
    server_unavailable:'Google Drive did not respond. Try again in a moment.'};
  let m=M[c]||'Google Drive could not complete that request.';
  if(c==='tool_error')m='Google Drive reported a problem'+(e.message?': '+String(e.message).slice(0,220):'.');
  if(write&&['server_unavailable','upstream_error','cancelled'].includes(c))m='Google Drive did not confirm the result, so the item may already exist. Refresh the folder before trying again.';
  DRV.err=m;DRV.msg='';DRV.busy='';refresh()}
const folderName=o=>`${o.fileNo||'Untitled file'} - ${propAddr(o)||'No address'}`.slice(0,180);
function addDoc(o,f,kind){const d=driveOf(o);if(d.docs.some(x=>x.id===f.id))return;d.docs.unshift({id:f.id,title:f.title||'Untitled',url:f.viewUrl||'',kind,mime:f.mimeType||'',at:Date.now()})}
function hudDocHtml(o,C){
  const css='body{font:10px Arial,Helvetica,sans-serif;color:#111}.hud{max-width:800px;margin:0 auto 28px;page-break-after:always}table{border-collapse:collapse;width:100%}td,th{border:1px solid #333;padding:3px 5px;vertical-align:top}.amt,.inner{text-align:right;white-space:nowrap}.sh{background:#eee;font-weight:bold}.lbl{font-size:9px;font-weight:bold;display:block}.hdr{display:flex;justify-content:space-between;align-items:flex-end}.hdr h3{margin:0 0 6px;font-size:15px}.omb{font-size:9px;text-align:right}.foot{display:flex;justify-content:space-between;font-size:9px;margin-top:6px}.sig{display:grid;grid-template-columns:1fr 1fr;gap:28px 40px;margin-top:24px}.sig div{border-top:1px solid #333;padding-top:4px}.gfe{font-size:8px;color:#444}.note{font-size:9px}';
  return `<!doctype html><html><head><meta charset="utf-8"><title>HUD-1 ${esc(o.fileNo||'')}</title><style>${css}</style></head><body>${hudPage1(o,C)}${hudPage2(o,C)}${hudPage3(o,C)}</body></html>`}
function stampHud(o){if(!o.hudVersion){o.hudVersion=1;o.hudGenerated=new Date().toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'})}}
const DRIVE_ACT={
  async driveList(){const o=O(),d=driveOf(o);if(!d.folderId)return;DRV.busy='list';DRV.err='';refresh();
    try{const p=await drive('search_files',{query:`parentId = '${qs(d.folderId)}'`,pageSize:50,excludeContentSnippets:true});
      if(O().id!==o.id)return;DRV.list=filesOf(p);DRV.listFor=d.folderId;DRV.listAt=Date.now();DRV.busy='';

    const no=m==='Check'?String(o.nextCheck++):'W-'+String(o.nextWire++).padStart(3,'0');
    o.issued[d.key]={no,method:m,date:today(),amount:d.amt,name:d.name};logA(o,`${m} ${no} issued to ${d.name} for ${money(d.amt)}`,'money');UI.check=d.key;save();render()},
  voidD(el){const iss=O().issued[el.dataset.key];if(iss)logA(O(),`${iss.method} ${iss.no} to ${iss.name} voided (${money(iss.amount)})`,'money');delete O().issued[el.dataset.key];if(UI.check===el.dataset.key)UI.check=null;save();render()},
  viewCheck(el){UI.check=el.dataset.key;render()},closeCheck(){UI.check=null;render()},
  generate(){const o=O();const d=new Date();o.hudGenerated=d.toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'});
    o.hudVersion=(o.hudVersion||0)+1;logA(o,`HUD-1 generated (version ${o.hudVersion})`,'doc');UI.tab='hud';try{history.replaceState(null,'','#hud')}catch(e){}save();render();
    const el=document.getElementById('hud-doc');if(el)el.scrollIntoView({block:'start'})},
  jump(el){const t=document.getElementById(el.dataset.to);if(t)t.scrollIntoView({block:'start'})},
  closeFile(){const o=O();if(compute(o).errors)return;o.status='Closed';o.closedAt=today();logA(o,'File closed','status');save();render()},
  reopen(){O().status='Open';O().closedAt='';logA(O(),'File reopened','status');save();render()},
  copyMerge(){const t=document.getElementById('merge-out').textContent;copyText(t,document.getElementById('merge-out'))},
  exportJson(){const ta=document.getElementById('io');UI.io=JSON.stringify(O(),null,1);ta.value=UI.io;copyText(UI.io,ta);msg('File data is in the box below and copied to your clipboard if your browser allowed it.')},
  importJson(){const ta=document.getElementById('io');try{const d=JSON.parse(ta.value);
      if(!d||!Array.isArray(d.items)||!Array.isArray(d.contacts)||!d.settings)throw new Error('missing parts');
      d.id=uid();norm(d);logA(d,'File loaded from pasted data','status');d.receipts=d.receipts||[];d.issued=d.issued||{};d.drive=d.drive||{folderId:'',folderTitle:'',folderUrl:'',docs:[]};DB.orders.push(d);DB.current=d.id;UI.io='';save();UI.tab='order';render()}
    catch(e){msg('That text is not a closing-desk file. Paste the full text produced by "Copy this file\'s data".')}},
  loadSample(){const o=sampleOrder();logA(o,'File opened (test scenario)','status');DB.orders.push(o);DB.current=o.id;UI.tab='hud';save();render()},
};
Object.assign(ACT,DRIVE_ACT);
function msg(t){const m=document.getElementById('io-msg');if(m)m.textContent=t}
function copyText(t,el){try{navigator.clipboard.writeText(t).catch(()=>selectEl(el))}catch(e){selectEl(el)}}
function selectEl(el){if(!el)return;if(el.select){el.select();return}const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='side-q'){UI.q=el.value;refresh();return}if(el.id==='dash-q'){UI.dq=el.value;refresh();return}if(el.id==='crm-q'){UI.cq=el.value;refresh();return}
  if(!el.dataset||!el.dataset.bind||el.dataset.re||el.tagName==='SELECT')return;apply(el);refresh()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target&&e.target.id;
  if(id==='drv-q')ACT.driveSearch();else if(id==='drv-fq')ACT.driveFindFolders();
  else if(id==='side-q'){const b=document.querySelector('.side-list .fi');if(b)b.click()}});
function afterChange(path,nv){const o=O();let m;
  if(/^tax\.(state|locality|ptype|primary)$/.test(path)){if(path==='tax.state')o.tax.locality='';if(o.tax.confirmed){o.tax.confirmed=false;logA(o,'Transfer tax confirmation cleared after a rule change','edit')}return true}
  if(path==='property.state'&&!o.tax.state&&o.tax.confirmed){o.tax.confirmed=false;return true}
  if((m=path.match(/^milestones\.(\d+)\.status$/))){const ms=o.milestones[+m[1]];if(nv==='received'&&!ms.received)ms.received=today();if(nv==='requested'&&!ms.requested)ms.requested=today();if(nv!=='received')ms.auto=false;return true}
  if((m=path.match(/^milestones\.(\d+)\.docId$/))){const ms=o.milestones[+m[1]];if(nv&&ms.status!=='received'){ms.status='received';ms.received=ms.received||today()}return true}
  if((m=path.match(/^contacts\.(\d+)\.name$/))){const c=o.contacts[+m[1]];const k=nv.trim().toLowerCase();if(!k)return false;
    const src=DB.orders.flatMap(x=>x.contacts).find(x=>x!==c&&(x.name||'').trim().toLowerCase()===k);if(!src)return false;let n=0;
    ['address','phone','email','ref'].forEach(f=>{if(!c[f]&&src[f]){c[f]=src[f];n++}});if(n){logA(o,`Filled ${c.name}’s details from the contacts directory`,'edit');return true}}
  return false}
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.bind){const path=el.dataset.bind;const old=el._old!==undefined?el._old:String(getPath(O(),path)??'');apply(el);const nv=String(getPath(O(),path)??'');let re=!!el.dataset.re;
    if(old!==nv){if(afterChange(path,nv))re=true;logA(O(),path==='mergeTemplate'?'Merge template edited':`${fieldLabel(path)}: ${valDisp(path,old,el.dataset.num==='2')} → ${valDisp(path,nv,el.dataset.num==='2')}`,/^(receipts|payoffs)\./.test(path)?'money':'edit');save()}
    el._old=nv;
    if(re)render();else{if(el.dataset.num)el.value=fmtIn(getPath(O(),path),+el.dataset.num);refresh()}}
  else if(el.dataset.change&&ACT[el.dataset.change])ACT[el.dataset.change](el)});
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.bind)t._old=String(getPath(O(),t.dataset.bind)??'');if(e.target.matches&&e.target.matches('input.num'))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});

(function boot(){const h=(location.hash||'').slice(1);if(PANELS[h]||h==='dash')UI.tab=h;render();
  const use=n=>{try{return window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
  use('db').then(db=>{if(!db)return;REMOTE=db;SYNC='connecting';refresh();
    db.collection('orders').onSnapshot(onRemote,syncFail);
    db.doc('config/app').onSnapshot(sn=>{if(sn.exists){const c=sn.data()||{};CFG.driveRootId=String(c.driveRootId||'');CFG.driveRootTitle=String(c.driveRootTitle||'');refresh()}},()=>{});
  }).catch(()=>{});
  use('mcp').then(m=>{MCP=m;if(MCP&&UI.tab==='docs')render();else refresh()}).catch(()=>{});
  use('downloads').then(d=>{DL=d;refresh()}).catch(()=>{});
  use('user').then(async u=>{if(!u)return;USER=u;try{ME=(await u.id())||''}catch(e){}refreshNames();refresh()}).catch(()=>{});
})();
</script>
